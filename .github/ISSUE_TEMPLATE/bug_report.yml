name: Bug report
description: Something did not work the way this repository says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Use the private advisories form instead.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The ps sample (fake pids are fine), the options, and which pids were signalled.
      placeholder: |
        $ node docs/demo/track.mjs
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you installed, and the Node version.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and version. Windows is a no-op by design.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A small reproduction, or what you already tried.
    validations:
      required: false
